name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: everything a tag would build and check, published nowhere. A
  # tag is never moved, so the first run of a changed release must not be the
  # one that ships.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package.sh'
      - 'scripts/arch.sh'
      - 'scripts/check-package.sh'
      - 'packaging/**'
      - 'scripts/build.sh'
      - 'scripts/compat/**'
      - 'systemd/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.6.2)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

jobs:
  # Built on a runner of the architecture it targets, rather than cross-compiled:
  # rustls pulls in C, and a native runner is cheaper than a cross toolchain.
  # Static musl, because the C compiled against the runner's glibc asked for
  # 2.38 and the binary would not start on Debian 12 or Ubuntu 22.04.
  binary:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as, so the checks below still compare the
      # manifests with each other.
      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary is static, runs and agrees with the tag
        run: |
          binary="target/$TARGET/release/tailgauge"
          if readelf -d "$binary" | grep -q NEEDED; then
            readelf -d "$binary"
            echo "::error::the binary links a shared library"
            exit 1
          fi
          printed=$("$binary" --version)
          echo "$printed"
          if [[ $printed != "tailgauge ${REF_NAME#v}" ]]; then
            echo "::error::the binary reports '$printed', not ${REF_NAME#v}"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailgauge-${{ matrix.arch }}
          path: target/${{ env.TARGET }}/release/tailgauge
          if-no-files-found: error

  assets:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as, so the checks below still compare the
      # manifests with each other.
      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install glib tools and nfpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin
          deb="nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$deb"
          echo "$NFPM_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      # Nothing ships that the tests have not seen: the same build.sh output is
      # what the tests import and what the archives carry.
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          scripts/build.sh

      - name: Test
        run: cargo test --locked

      # A tag that disagrees with the manifests would publish assets whose
      # in-app version does not match the release they came from.
      - name: Check the tag matches the manifests
        run: |
          version="${REF_NAME#v}"
          plasmoid=$(node -e 'process.stdout.write(require("./plasma/org.tailgauge.plasmoid/metadata.json").KPlugin.Version)')
          extension=$(node -e 'process.stdout.write(require("./gnome/tailgauge@arzaroth.github.io/metadata.json")["version-name"])')
          plugin=$(node -e 'process.stdout.write(require("./omarchy/arzaroth.tailgauge/manifest.json").version)')
          binary=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=$version plasmoid=$plasmoid extension=$extension plugin=$plugin binary=$binary"
          if [[ $plasmoid != "$version" || $extension != "$version" || $plugin != "$version" || $binary != "$version" ]]; then
            echo "::error::tag $REF_NAME does not match the manifests"
            exit 1
          fi

      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries

      - name: Package
        run: |
          # Sanitize the ref so path separators cannot break out of dist/.
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist

          # The plasmoid: a zip of the package contents, which is what both
          # `kpackagetool6 -i` and the KDE Store accept.
          (cd build/org.tailgauge.plasmoid && zip -qr "$GITHUB_WORKSPACE/dist/tailgauge-$safe-plasmoid.plasmoid" .)

          # The extension, as gnome-extensions install takes it.
          cp "build/tailgauge@arzaroth.github.io.shell-extension.zip" \
             "dist/tailgauge-$safe-gnome-shell-extension.zip"

          # The Omarchy plugin, as a folder the shell's registry can take
          # verbatim under ~/.config/omarchy/plugins/.
          tar -czf "dist/tailgauge-$safe-omarchy-plugin.tar.gz" -C build arzaroth.tailgauge

          # One archive per architecture: the binary, the frontend payloads it
          # installs, and the Taildrop unit. This is what `tailgauge update`
          # downloads, and the layout crates/tailgauge/src/frontend.rs expects.
          for arch in x86_64 aarch64; do
            stage="pack/$arch"
            rm -rf "$stage"
            mkdir -p "$stage/frontends/plasma" "$stage/frontends/gnome" \
                     "$stage/frontends/omarchy" "$stage/systemd"
            install -m 755 "binaries/tailgauge-$arch/tailgauge" "$stage/tailgauge"
            cp -a build/org.tailgauge.plasmoid "$stage/frontends/plasma/"
            cp -a "build/tailgauge@arzaroth.github.io" "$stage/frontends/gnome/"
            cp -a build/arzaroth.tailgauge "$stage/frontends/omarchy/"
            cp systemd/tailgauge-receive.service "$stage/systemd/"
            # MIT asks that its notice travel with a copy, and an archive is a
            # copy. NOTICE is what says which portions that covers.
            cp LICENSE LICENSE-MIT LICENSE-WTFPL NOTICE "$stage/"
            tar -czf "dist/tailgauge-$safe-linux-$arch.tar.gz" -C "$stage" .
            # The .deb and .rpm, from the archive rather than beside it, so a
            # package and `--update` install the same bytes.
            scripts/package.sh "dist/tailgauge-$safe-linux-$arch.tar.gz" dist
          done

          # The `helpers` asset an install from 0.4.0 or earlier still asks
          # for. There are no helpers any more, so what it carries is the
          # bootstrap that fetches the binary: without it that updater 404s,
          # and it does so *after* upgrading the frontends, which leaves a
          # panel calling a binary nobody installed.
          rm -rf pack/helpers
          mkdir -p pack/helpers/bin
          install -m 755 scripts/compat/tailgauge-update pack/helpers/bin/tailgauge-update
          tar -czf "dist/tailgauge-$safe-helpers.tar.gz" -C pack/helpers .

          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-assets
          path: dist/*
          if-no-files-found: error

  # makepkg needs an Arch system. The -bin package repackages the archives the
  # job above made; the source one is built to prove its PKGBUILD, and only
  # that PKGBUILD ships.
  arch:
    needs: assets
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib cargo nodejs pnpm glib2 git

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: The release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-assets
          path: dist

      - name: Build the packages
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${REF_NAME#v}"
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          git config --global --add safe.directory "$PWD"
          if [[ $PUBLISH == true ]]; then
            curl -fsSL "https://github.com/$REPOSITORY/archive/refs/tags/$REF_NAME.tar.gz" -o source.tar.gz
          else
            git archive --prefix="TailGauge-$version/" HEAD -o source.tar.gz
          fi
          useradd -m builder
          chown -R builder .
          su builder -c "scripts/arch.sh bin $version dist"
          su builder -c "scripts/arch.sh source $version dist source.tar.gz"
          mkdir -p out
          cp dist/tailgauge-bin-*.pkg.tar.zst out/
          tar -czf "out/tailgauge-$safe-pkgbuild.tar.gz" -C dist/arch .

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-arch
          path: out/*
          if-no-files-found: error

  checksums:
    needs: [assets, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Signing starts the day packaging/tailgauge.asc is committed, and from
      # then on a release without the key behind it refuses to publish. A pull
      # request never sees the secret, so its rehearsal stays unsigned.
      - name: Signing key
        id: key
        env:
          KEY: ${{ env.PUBLISH == 'true' && secrets.TAILGAUGE_GPG_KEY || '' }}
          PASSPHRASE: ${{ env.PUBLISH == 'true' && secrets.TAILGAUGE_GPG_PASSPHRASE || '' }}
        run: |
          fpr=""
          if [[ -f packaging/tailgauge.asc ]]; then
            fpr="$(gpg --show-keys --with-colons packaging/tailgauge.asc | awk -F: '/^fpr/ { print $10; exit }')"
          fi
          if [[ -z "$KEY" ]]; then
            if [[ -n "$fpr" && "$PUBLISH" == true ]]; then
              echo "::error::packaging/tailgauge.asc is committed, so a release needs the TAILGAUGE_GPG_KEY secret"
              exit 1
            fi
            echo "No signing key in this run: the packages stay unsigned"
            exit 0
          fi
          if [[ -z "$fpr" ]]; then
            echo "::error::TAILGAUGE_GPG_KEY is set but packaging/tailgauge.asc, its public half, is not committed"
            exit 1
          fi
          printf '%s' "$PASSPHRASE" >"$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          if ! gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10 }' | grep -qx "$fpr"; then
            echo "::error::TAILGAUGE_GPG_KEY is not the key packaging/tailgauge.asc publishes ($fpr)"
            exit 1
          fi
          sudo apt-get install -qq -y rpm >/dev/null
          echo "fpr=$fpr" >>"$GITHUB_OUTPUT"

      - name: Sign the packages
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          cd dist
          rpmsign --addsign \
            --define "__gpg $(command -v gpg)" \
            --define "_gpg_name $FPR" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/passphrase" \
            -- *.rpm
          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
              --local-user "$FPR" --detach-sign --no-armor --output "$pkg.sig" "$pkg"
          done
          cp ../packaging/tailgauge.asc tailgauge-release-key.asc

      # What scripts/install.sh checks a download against before running it,
      # taken once every asset is in and signed.
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --local-user "$FPR" --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/passphrase"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  # Every package installed on a distribution that has never seen this tree,
  # before anything is published: the oldest glibc anyone is likely to run it
  # on, and each package manager's own idea of what a package should hold.
  verify:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            deb: amd64
            rpm: x86_64
            pkg: x86_64
          # No archlinux image for arm64.
          - runs-on: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: The checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: The signatures
        if: hashFiles('dist/SHA256SUMS.asc') != ''
        env:
          PKG: ${{ matrix.pkg }}
          RPM: ${{ matrix.rpm }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --import packaging/tailgauge.asc
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          docker run --rm -e RPM -v "$PWD/dist:/d:ro" fedora:latest sh -ec '
            rpm --import /d/tailgauge-release-key.asc
            rpm -K /d/tailgauge-*."$RPM".rpm | tee /dev/stderr | grep -q "signatures OK"'
          if [[ -n $PKG ]]; then
            fpr=$(gpg --show-keys --with-colons packaging/tailgauge.asc | awk -F: '/^fpr/ { print $10; exit }')
            docker run --rm -e PKG -e FPR="$fpr" -v "$PWD/dist:/d:ro" archlinux:latest sh -ec '
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/tailgauge-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
              for pkg in /d/tailgauge-bin-*-"$PKG".pkg.tar.zst; do
                pacman-key --verify "$pkg.sig" "$pkg"
              done'
          fi

      - name: The .deb on Debian 12 and Ubuntu 22.04
        env:
          DEB: ${{ matrix.deb }}
        run: |
          for image in debian:12 ubuntu:22.04; do
            docker run --rm -e DEB -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" "$image" sh -ec '
              apt-get update -qq >/dev/null
              apt-get install -qq -y /d/tailgauge_*_"$DEB".deb >/dev/null
              sh /s/check-package.sh
              apt-get remove -qq -y tailgauge >/dev/null
              test ! -e /usr/share/plasma/plasmoids/org.tailgauge.plasmoid'
          done

      - name: The .rpm on Fedora
        env:
          RPM: ${{ matrix.rpm }}
        run: |
          docker run --rm -e RPM -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" fedora:latest sh -ec '
            rpm -i /d/tailgauge-*."$RPM".rpm
            rpm -V tailgauge
            sh /s/check-package.sh
            rpm -e tailgauge
            test ! -e /usr/share/plasma/plasmoids/org.tailgauge.plasmoid'

      - name: The Arch package
        if: matrix.pkg
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          fpr=""
          if [[ -f dist/tailgauge-release-key.asc ]]; then
            fpr=$(gpg --show-keys --with-colons dist/tailgauge-release-key.asc | awk -F: '/^fpr/ { print $10; exit }')
          fi
          docker run --rm -e PKG -e FPR="$fpr" -v "$PWD/dist:/d:ro" -v "$PWD/scripts:/s:ro" archlinux:latest sh -ec '
            sed -i "/^NoExtract/d" /etc/pacman.conf
            if [ -n "$FPR" ]; then
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/tailgauge-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
            fi
            pacman -U --noconfirm /d/tailgauge-bin-*-"$PKG".pkg.tar.zst >/dev/null
            pacman -Qkk tailgauge-bin
            sh /s/check-package.sh'

      - name: install.sh
        run: |
          home=$(mktemp -d)
          HOME=$home TAILGAUGE_DOWNLOAD_BASE="$PWD/dist" bash -s -- --no-frontend --no-taildrop <scripts/install.sh
          "$home/.local/bin/tailgauge" --version

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v hdr="## [$version]" '
              index($0, hdr) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md >release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::No CHANGELOG.md section for $version - falling back to auto-generated notes."
            : >release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.plasmoid
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.sig
            dist/*.asc
            dist/SHA256SUMS
