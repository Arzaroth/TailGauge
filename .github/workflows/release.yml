name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: everything a tag would build and check, published nowhere. A
  # tag is never moved, so the first run of a changed release must not be the
  # one that ships.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/package.sh'
      - 'packaging/**'
      - 'scripts/build.sh'
      - 'scripts/compat/**'
      - 'systemd/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.6.2)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  NFPM_VERSION: 2.47.0
  NFPM_SHA256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97

jobs:
  # Built on a runner of the architecture it targets, rather than cross-compiled:
  # rustls pulls in C, and a native runner is cheaper than a cross toolchain.
  # Static musl, because the C compiled against the runner's glibc asked for
  # 2.38 and the binary would not start on Debian 12 or Ubuntu 22.04.
  binary:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as, so the checks below still compare the
      # manifests with each other.
      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary is static, runs and agrees with the tag
        run: |
          binary="target/$TARGET/release/tailgauge"
          if readelf -d "$binary" | grep -q NEEDED; then
            readelf -d "$binary"
            echo "::error::the binary links a shared library"
            exit 1
          fi
          printed=$("$binary" --version)
          echo "$printed"
          if [[ $printed != "tailgauge ${REF_NAME#v}" ]]; then
            echo "::error::the binary reports '$printed', not ${REF_NAME#v}"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailgauge-${{ matrix.arch }}
          path: target/${{ env.TARGET }}/release/tailgauge
          if-no-files-found: error

  assets:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The tag being released, or on a pull request the one the workspace
      # version would be tagged as, so the checks below still compare the
      # manifests with each other.
      - name: The tag
        run: |
          if [[ $PUBLISH == true ]]; then
            echo "REF_NAME=${REF#refs/tags/}" >>"$GITHUB_ENV"
          else
            echo "REF_NAME=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >>"$GITHUB_ENV"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install glib tools and nfpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin
          deb="nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$deb"
          echo "$NFPM_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      # Nothing ships that the tests have not seen: the same build.sh output is
      # what the tests import and what the archives carry.
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          scripts/build.sh

      - name: Test
        run: cargo test --locked

      # A tag that disagrees with the manifests would publish assets whose
      # in-app version does not match the release they came from.
      - name: Check the tag matches the manifests
        run: |
          version="${REF_NAME#v}"
          plasmoid=$(node -e 'process.stdout.write(require("./plasma/org.tailgauge.plasmoid/metadata.json").KPlugin.Version)')
          extension=$(node -e 'process.stdout.write(require("./gnome/tailgauge@arzaroth.github.io/metadata.json")["version-name"])')
          plugin=$(node -e 'process.stdout.write(require("./omarchy/arzaroth.tailgauge/manifest.json").version)')
          binary=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=$version plasmoid=$plasmoid extension=$extension plugin=$plugin binary=$binary"
          if [[ $plasmoid != "$version" || $extension != "$version" || $plugin != "$version" || $binary != "$version" ]]; then
            echo "::error::tag $REF_NAME does not match the manifests"
            exit 1
          fi

      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: binaries

      - name: Package
        run: |
          # Sanitize the ref so path separators cannot break out of dist/.
          safe="${REF_NAME//[^A-Za-z0-9._-]/_}"
          mkdir -p dist

          # The plasmoid: a zip of the package contents, which is what both
          # `kpackagetool6 -i` and the KDE Store accept.
          (cd build/org.tailgauge.plasmoid && zip -qr "$GITHUB_WORKSPACE/dist/tailgauge-$safe-plasmoid.plasmoid" .)

          # The extension, as gnome-extensions install takes it.
          cp "build/tailgauge@arzaroth.github.io.shell-extension.zip" \
             "dist/tailgauge-$safe-gnome-shell-extension.zip"

          # The Omarchy plugin, as a folder the shell's registry can take
          # verbatim under ~/.config/omarchy/plugins/.
          tar -czf "dist/tailgauge-$safe-omarchy-plugin.tar.gz" -C build arzaroth.tailgauge

          # One archive per architecture: the binary, the frontend payloads it
          # installs, and the Taildrop unit. This is what `tailgauge update`
          # downloads, and the layout crates/tailgauge/src/frontend.rs expects.
          for arch in x86_64 aarch64; do
            stage="pack/$arch"
            rm -rf "$stage"
            mkdir -p "$stage/frontends/plasma" "$stage/frontends/gnome" \
                     "$stage/frontends/omarchy" "$stage/systemd"
            install -m 755 "binaries/tailgauge-$arch/tailgauge" "$stage/tailgauge"
            cp -a build/org.tailgauge.plasmoid "$stage/frontends/plasma/"
            cp -a "build/tailgauge@arzaroth.github.io" "$stage/frontends/gnome/"
            cp -a build/arzaroth.tailgauge "$stage/frontends/omarchy/"
            cp systemd/tailgauge-receive.service "$stage/systemd/"
            # MIT asks that its notice travel with a copy, and an archive is a
            # copy. NOTICE is what says which portions that covers.
            cp LICENSE LICENSE-MIT LICENSE-WTFPL NOTICE "$stage/"
            tar -czf "dist/tailgauge-$safe-linux-$arch.tar.gz" -C "$stage" .
            # The .deb and .rpm, from the archive rather than beside it, so a
            # package and `--update` install the same bytes.
            scripts/package.sh "dist/tailgauge-$safe-linux-$arch.tar.gz" dist
          done

          # The `helpers` asset an install from 0.4.0 or earlier still asks
          # for. There are no helpers any more, so what it carries is the
          # bootstrap that fetches the binary: without it that updater 404s,
          # and it does so *after* upgrading the frontends, which leaves a
          # panel calling a binary nobody installed.
          rm -rf pack/helpers
          mkdir -p pack/helpers/bin
          install -m 755 scripts/compat/tailgauge-update pack/helpers/bin/tailgauge-update
          tar -czf "dist/tailgauge-$safe-helpers.tar.gz" -C pack/helpers .

          # What scripts/install.sh checks a download against before running it.
          (cd dist && sha256sum -- * >SHA256SUMS)
          cat dist/SHA256SUMS

          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if [[ -f CHANGELOG.md ]]; then
            awk -v hdr="## [$version]" '
              index($0, hdr) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md >release-notes.md
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::No CHANGELOG.md section for $version - falling back to auto-generated notes."
            : >release-notes.md
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.plasmoid
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
