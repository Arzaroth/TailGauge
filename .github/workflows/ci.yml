name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  # Every frontend shells out to this, so a break here is a break on all three.
  # Built on both architectures a release publishes, because that is where a
  # target-specific mistake would otherwise first be seen.
  binary:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install glib tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The e2e tests run the shipped binary against fake `tailscale` and
      # `netbird` commands on an isolated PATH, so what they exercise is the
      # gather - probe, poll, parse, resolve - and not just its pieces.
      - name: Test
        run: cargo test --locked

  # The frontends install separately from anything the binary job builds, so a
  # syntax error in one of them ships without any other job noticing.
  frontends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install qmllint and glib tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools libglib2.0-bin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: scripts/build.sh

      - name: Lint QML
        run: |
          shopt -s globstar nullglob
          files=(build/org.tailgauge.plasmoid/contents/ui/*.qml build/arzaroth.tailgauge/*.qml)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no QML found - the glob has gone stale" >&2
            exit 1
          fi
          # Every Plasma, Kirigami and Quickshell import is unresolvable here, and some
          # qmllint builds exit non-zero on those warnings while others exit 0.
          # So the exit code is not the signal: a `[syntax]` diagnostic is. That
          # is the failure that actually ships, since a plasmoid with a syntax
          # error loads as a blank panel.
          set +e
          out=$(/usr/lib/qt6/bin/qmllint "${files[@]}" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [[ $status -eq 126 || $status -eq 127 ]]; then
            echo "::error::qmllint could not be run (exit $status)"
            exit 1
          fi
          if grep -q '\[syntax\]' <<<"$out"; then
            echo "::error::QML syntax error - see the [syntax] diagnostics above"
            exit 1
          fi

      - name: Typecheck the GNOME extension
        run: pnpm typecheck

      # Loads each QML frontend's service in a plain QML runtime, with the
      # desktop imports stubbed, and drives it with a recorded panel. qmllint
      # cannot reach this: it exits silently when an import will not resolve,
      # which is every Plasma and Quickshell import on a runner.
      - name: Drive the QML frontends against a recorded panel
        run: tests/qml/run.sh

      # Node rather than GJS: the loader hook in register.js answers the
      # `gi://` imports with mocks, so the extension's logic runs here without
      # a shell to host it.
      - name: Test the GNOME extension
        run: node --import ./tests/gnome/register.js --test 'tests/gnome/**/*.test.js'

      - name: Check the GNOME extension
        run: |
          shopt -s globstar nullglob
          files=(build/tailgauge@arzaroth.github.io/*.js)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no extension sources found - the glob has gone stale" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --input-type=module --check <"$file"
          done

      - name: Check the manifests
        run: |
          shopt -s globstar nullglob
          files=(gnome/**/metadata.json plasma/**/metadata.json omarchy/**/manifest.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no manifests found - the glob has gone stale" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done

      - name: Check the settings schemas
        run: |
          glib-compile-schemas --strict --dry-run gnome/tailgauge@arzaroth.github.io/schemas
          python3 -c "import xml.dom.minidom, sys; xml.dom.minidom.parse(sys.argv[1])" \
            plasma/org.tailgauge.plasmoid/contents/config/main.xml

      # The three frontends and the binary declare a version; a release that
      # bumps one and forgets another ships two different products.
      - name: Check the versions agree
        run: |
          plasmoid=$(node -e 'process.stdout.write(require("./plasma/org.tailgauge.plasmoid/metadata.json").KPlugin.Version)')
          echo "plasmoid=$plasmoid"
          declare -A declared=(
            [gnome/tailgauge@arzaroth.github.io/metadata.json]=$(node -e 'process.stdout.write(require("./gnome/tailgauge@arzaroth.github.io/metadata.json")["version-name"])')
            [omarchy/arzaroth.tailgauge/manifest.json]=$(node -e 'process.stdout.write(require("./omarchy/arzaroth.tailgauge/manifest.json").version)')
            [Cargo.toml]=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          )
          status=0
          for file in "${!declared[@]}"; do
            echo "$file=${declared[$file]}"
            if [[ ${declared[$file]} != "$plasmoid" ]]; then
              echo "::error file=$file::declares '${declared[$file]}', but the plasmoid declares '$plasmoid'"
              status=1
            fi
          done
          exit $status

  helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Syntax-check the shell scripts
        run: |
          shopt -s nullglob
          files=(scripts/*.sh)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no shell sources found - the glob has gone stale" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: ShellCheck
        run: |
          shopt -s nullglob
          shellcheck --severity=warning scripts/*.sh

      - name: Check the scripts are executable
        run: |
          shopt -s nullglob
          for file in scripts/*.sh; do
            if [[ ! -x $file ]]; then
              echo "::error::$file is not executable - the installer copies the mode bits"
              exit 1
            fi
          done

      # Informational: verify also resolves ExecStart, which does not exist on a
      # runner, so its exit code cannot be the signal. A malformed unit still
      # prints a parse error here.
      - name: Check the systemd unit parses
        run: |
          out=$(systemd-analyze verify --user systemd/tailgauge-receive.service 2>&1 || true)
          echo "$out"
          if grep -qiE 'Unknown (key|section)|Failed to parse' <<<"$out"; then
            echo "::error::the unit file does not parse"
            exit 1
          fi
