[workspace]
resolver = "2"
members = ["crates/tailgauge-core", "crates/tailgauge"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Arzaroth/TailGauge"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
