[package]
name = "tailgauge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tailscale in the panel: the binary every TailGauge frontend shells out to."

[[bin]]
name = "tailgauge"
path = "src/main.rs"

[dependencies]
tailgauge-core = { path = "../tailgauge-core" }
anyhow = { workspace = true }
selvedge = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
