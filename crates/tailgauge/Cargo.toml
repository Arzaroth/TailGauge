[package]
name = "tailgauge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tailscale in the panel: the binary every TailGauge frontend shells out to."

[[bin]]
name = "tailgauge"
path = "src/main.rs"

[dependencies]
tailgauge-core = { path = "../tailgauge-core" }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "archive-tar", "compression-flate2", "archive-zip", "compression-zip-deflate"] }
http = "1"
